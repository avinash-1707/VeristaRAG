services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: veritasrag
      POSTGRES_USER: veritasrag
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-veritasrag}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U veritasrag -d veritasrag"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_URL=postgresql://veritasrag:${POSTGRES_PASSWORD:-veritasrag}@postgres:5432/veritasrag
      - REDIS_URL=redis://redis:6379/0
      - AI_SERVICE_URL=http://fastapi:8001
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: ["python", "manage.py", "runserver", "0.0.0.0:8000"]

  fastapi:
    build:
      context: ./ai_service
      dockerfile: Dockerfile
    env_file:
      - ./ai_service/.env
    environment:
      - DATABASE_URL=postgresql://veritasrag:${POSTGRES_PASSWORD:-veritasrag}@postgres:5432/veritasrag
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./ai_service:/app
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8001", "--reload"]

  celery:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_URL=postgresql://veritasrag:${POSTGRES_PASSWORD:-veritasrag}@postgres:5432/veritasrag
      - REDIS_URL=redis://redis:6379/0
      - AI_SERVICE_URL=http://fastapi:8001
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: ["celery", "-A", "config", "worker", "--loglevel=info", "--concurrency=2"]

volumes:
  postgres_data:
